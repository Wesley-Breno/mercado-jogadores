name: mercado-jogadores

services:
  db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercado}
      POSTGRES_DB: ${POSTGRES_DB:-mercado}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mercado}:${POSTGRES_PASSWORD:-mercado}@db:5432/${POSTGRES_DB:-mercado}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mercado}:${POSTGRES_PASSWORD:-mercado}@db:5432/mercado_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
