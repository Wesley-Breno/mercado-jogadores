name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: mercado
          POSTGRES_PASSWORD: mercado
          POSTGRES_DB: mercado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercado -d mercado"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mercado:mercado@localhost:5432/mercado_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  compose-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Sobe a aplicação com os comandos do README
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Espera a API e a interface responderem
        run: |
          timeout 300 bash -c 'until curl -sf http://localhost:8000/api/v1/health; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 2; done'
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Testes de ponta a ponta (Playwright) contra a aplicação no ar
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Logs dos contêineres
        if: failure()
        run: docker compose logs
