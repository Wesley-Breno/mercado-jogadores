name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: mercado
          POSTGRES_PASSWORD: mercado
          POSTGRES_DB: mercado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercado -d mercado"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mercado:mercado@localhost:5432/mercado_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
